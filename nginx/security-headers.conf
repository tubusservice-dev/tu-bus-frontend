# Security headers shared by every location block.
#
# nginx does NOT inherit `add_header` into a block that declares its own, so a
# server-level declaration is silently dropped for /index.html, the service
# workers, the bundles and the media files — all of which set their own
# Cache-Control. Including this file in each of those blocks is the only way
# to keep the headers everywhere.
#
# Content-Security-Policy is deliberately absent: it needs a Report-Only
# observation period first (see the plan, block 5).

add_header X-Frame-Options        "SAMEORIGIN"                      always;
add_header X-Content-Type-Options "nosniff"                         always;
add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
add_header Permissions-Policy     "geolocation=(self), camera=(self), microphone=()" always;
