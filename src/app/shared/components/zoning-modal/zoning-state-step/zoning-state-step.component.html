<div class="search-box">
  <app-search-input
    placeholder="Busca tu municipio o ciudad, ej. Tocuyito"
    ariaLabel="Buscar municipio o ciudad"
    [value]="query()"
    [loading]="searching()"
    [debounceMs]="250"
    (searchChanged)="queryChange.emit($event)"
  />
</div>

@if (hits(); as found) {
  @if (found.length) {
    <div class="hit-list">
      @for (hit of found; track hit.municipality.id) {
        <button
          type="button"
          class="zone-btn"
          [class.zone-btn--current]="hit.municipality.id === currentMunicipalityId()"
          [attr.aria-current]="hit.municipality.id === currentMunicipalityId() ? 'true' : null"
          (click)="hitSelected.emit(hit)"
        >
          <span class="zone-btn__icon">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 10.5a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
              <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 10.5c0 7.142-7.5 11.25-7.5 11.25S4.5 17.642 4.5 10.5a7.5 7.5 0 1 1 15 0Z" />
            </svg>
          </span>
          <span class="zone-btn__text">
            <span class="zone-btn__name">{{ hit.municipality.name }}</span>
            <span class="zone-btn__meta">
              @if (hit.cityName) {
                {{ hit.cityName }} ·
              }
              {{ hit.state.name }}
            </span>
          </span>
        </button>
      }
    </div>
  } @else if (!searching()) {
    <p class="no-results">Todavía no atendemos ese municipio.</p>
  }
} @else {
  <div class="zone-grid">
    @for (entry of states(); track entry.state.id) {
      <button
        type="button"
        class="zone-btn"
        [class.zone-btn--current]="entry.state.id === currentStateId()"
        [attr.aria-current]="entry.state.id === currentStateId() ? 'true' : null"
        (click)="stateSelected.emit(entry)"
      >
        <span class="zone-btn__icon">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 6.75V15m6-6v8.25m.503 3.498 4.875-2.437c.381-.19.622-.58.622-1.006V4.82c0-.836-.88-1.38-1.628-1.006l-3.869 1.934c-.317.159-.69.159-1.006 0L9.503 3.252a1.125 1.125 0 0 0-1.006 0L3.622 5.689C3.24 5.88 3 6.27 3 6.695V19.18c0 .836.88 1.38 1.628 1.006l3.869-1.934c.317-.159.69-.159 1.006 0l4.994 2.497c.317.158.69.158 1.006 0Z" />
          </svg>
        </span>
        <span class="zone-btn__name">{{ entry.state.name }}</span>
      </button>
    }
  </div>
}
