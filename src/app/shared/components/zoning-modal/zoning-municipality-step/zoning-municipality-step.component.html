<button type="button" class="back-btn" (click)="back.emit()">
  <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" aria-hidden="true">
    <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5 8.25 12l7.5-7.5" />
  </svg>
  Cambiar estado
</button>

<h2 class="step-title">{{ entry().state.name }}</h2>
<p class="step-subtitle">Elige tu municipio</p>

<div class="zone-grid">
  @for (municipality of entry().municipalities; track municipality.id) {
    <button type="button" class="zone-btn" (click)="municipalitySelected.emit(municipality)">
      <span class="zone-btn__icon">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 10.5a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
          <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 10.5c0 7.142-7.5 11.25-7.5 11.25S4.5 17.642 4.5 10.5a7.5 7.5 0 1 1 15 0Z" />
        </svg>
      </span>
      <span class="zone-btn__text">
        <span class="zone-btn__name">{{ municipality.name }}</span>
        <span [class]="'delivery-badge delivery-badge--' + municipality.deliveryStatus">
          {{ labels[municipality.deliveryStatus] }}
        </span>
      </span>
    </button>
  }
</div>
