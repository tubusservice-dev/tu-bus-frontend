<div class="settings-page">
  <!-- Header -->
  <header class="page-header">
    <div>
      <h1 class="page-title">Configuraciones</h1>
      <p class="page-subtitle">Personaliza tu tienda TuBus Express</p>
    </div>
  </header>

  <!-- Loading -->
  @if (isLoading()) {
    <div class="loading-container">
      <div class="spinner"></div>
      <p>Cargando configuraciones...</p>
    </div>
  } @else {
    <!-- Acordeón de secciones -->
    <div class="settings-accordion">

      <app-settings-accordion-item
        heading="Imágenes del Hero"
        [iconPath]="icons.heroImages"
        [expanded]="activeSection() === 'heroImages'"
        (toggled)="toggleSection('heroImages')"
      >
        <app-hero-images-settings
          [floatingStatsForm]="floatingStatsForm"
          [heroImagesCarouselForm]="heroImagesCarouselForm"
          [(heroImages)]="heroImages"
        />
      </app-settings-accordion-item>

      <app-settings-accordion-item
        heading="Carruseles"
        [iconPath]="icons.carousels"
        [expanded]="activeSection() === 'carousels'"
        (toggled)="toggleSection('carousels')"
      >
        <app-carousels-settings [carouselsForm]="carouselsForm" />
      </app-settings-accordion-item>

      <app-settings-accordion-item
        heading="Paginación"
        [iconPath]="icons.pagination"
        [expanded]="activeSection() === 'pagination'"
        (toggled)="toggleSection('pagination')"
      >
        <app-pagination-settings [paginationForm]="paginationForm" />
      </app-settings-accordion-item>

      <app-settings-accordion-item
        heading="Módulos de Despacho"
        [iconPath]="icons.dispatchModules"
        [expanded]="activeSection() === 'dispatchModules'"
        (toggled)="toggleSection('dispatchModules')"
      >
        <app-dispatch-modules-settings [dispatchModulesForm]="dispatchModulesForm" />
      </app-settings-accordion-item>

      <!-- Configuración de Despacho: ahora controlado por sucursales -->

      <app-settings-accordion-item
        heading="Métodos de Pago"
        [iconPath]="icons.paymentMethods"
        [expanded]="activeSection() === 'paymentMethods'"
        (toggled)="toggleSection('paymentMethods')"
      >
        <app-payment-methods-settings [active]="activeSection() === 'paymentMethods'" />
      </app-settings-accordion-item>

      <app-settings-accordion-item
        heading="Tasa del Dólar"
        [iconPath]="icons.exchangeRate"
        [expanded]="activeSection() === 'exchangeRate'"
        (toggled)="toggleSection('exchangeRate')"
      >
        <app-exchange-rate-settings [(showBsPrice)]="showBsPrice" [(useCustomRate)]="useCustomRate" />
      </app-settings-accordion-item>

      <app-settings-accordion-item
        heading="Notificaciones"
        [iconPath]="icons.adminNotifications"
        [expanded]="activeSection() === 'adminNotifications'"
        (toggled)="toggleSection('adminNotifications')"
      >
        <app-admin-notifications-settings [adminNotificationsForm]="adminNotificationsForm" />
      </app-settings-accordion-item>

      <app-settings-accordion-item
        heading="Contacto de soporte para el mecánico"
        [iconPath]="icons.supportContact"
        [expanded]="activeSection() === 'supportContact'"
        (toggled)="toggleSection('supportContact')"
      >
        <app-support-contact-settings [supportContactForm]="supportContactForm" />
      </app-settings-accordion-item>

      <app-settings-accordion-item
        heading="Contacto para atención al Cliente"
        [iconPath]="icons.customerSupport"
        [expanded]="activeSection() === 'customerSupport'"
        (toggled)="toggleSection('customerSupport')"
      >
        <app-customer-support-settings [customerSupportForm]="customerSupportForm" />
      </app-settings-accordion-item>

    </div>
  }
</div>
